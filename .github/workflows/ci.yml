# CI for lean_models. Mirrors tools/ci.sh (the local entry point — keep in sync).
# The SV differential harness runs against Xcelium (`xrun`) where it exists
# (self-hosted) and otherwise against Icarus Verilog (`iverilog`, installed
# below via apt); tools/ci.sh auto-skips it only when neither simulator is
# present, so this workflow is safe on stock GitHub runners.
name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (pinned toolchain comes from lean-toolchain)
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache lake build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}
      - name: Notebook dependencies
        run: |
          python3 -m pip install --user nbformat nbclient jupyter-core ipykernel
          # SV extraction (notebook 03 + extractors/sv) runs under python3.12 + pyslang.
          # THE ==11.0.0 PIN IS RETIRED (2026-08-26). It was TEMPORARY, and its
          # stated condition — "remove when extract.py stamps the family" — is met:
          # extract.py sets FRONTEND = {"name": "pyslang", "family": "pyslang-11"},
          # and the 18 live envelopes carry the family, so a pyslang 11.x POINT
          # release no longer changes a single committed byte.
          #
          # The three envelopes still carrying "version": "11.0.0" (alu_div, ff_one,
          # popcnt) are SOURCELESS — sv_round_trip rows them not-live and excuses
          # them from the gate, envelope_fresh rows them NOT-LIVE. They cannot
          # affect either verdict, so they do not hold the pin open.
          #
          # And the pin is no longer what protects the gate: sv_round_trip now
          # RESOLVES the pinned frontend before it compares anything and REFUSES
          # (exit 3) on a wrong family, instead of reporting 18 DIVERGEs for what
          # is a frontend change. A major bump is therefore a named refusal, not
          # mystery content drift — which is the whole reason the pin existed.
          # A pin protecting nothing is a hollow gate, so it goes.
          python3.12 -m pip install --user pyslang || python3 -m pip install --user pyslang
      - name: Circuit simulators (SV and SPICE differential harnesses)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iverilog ngspice
      - name: Restore Mathlib build cache
        run: lake exe cache get
      - name: Full check
        run: bash tools/ci.sh
