name = "lean-models"
defaultTargets = ["LeanModels", "Examples", "leanmodels-run", "circuit-dc-runner", "c-torture-run"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0-rc1"

[[lean_lib]]
name = "LeanModels"

[[lean_lib]]
name = "Examples"
globs = ["Examples.+"]
needs = ["circuitSources", "verilogASources"]

[[input_dir]]
name = "circuitSources"
path = "Examples/spice"
text = true
filter = { extension = ["cir"] }

[[input_dir]]
name = "verilogASources"
path = "Examples/verilog-a"
text = true
filter = { extension = ["va", "json"] }

[[lean_exe]]
name = "leanmodels-run"
root = "Main"

[[lean_exe]]
name = "circuit-dc-runner"
root = "LeanModels.Circuit.DCRunner"
[[lean_exe]]
name = "c-torture-run"
root = "LeanModels.C.Torture"

